<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scan PDF">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Ảnh sang PDF</title>
<style>
:root{--bg:#e9ecef;--panel:#f7f8f9;--ink:#1b2430;--mute:#66707c;--line:#d3d8de;--acc:#1f5fd1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;font-weight:650}
header div{display:flex;gap:8px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover,.btn:hover{border-color:#aab2bb}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.primary:hover{background:#1a52b8;border-color:#1a52b8}
.danger{color:#b3261e}
[hidden]{display:none!important}
#view{touch-action:none}
.cropping #view{cursor:crosshair}
main{flex:1;display:flex;min-height:0}
#list{width:170px;overflow:auto;padding:10px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.item{position:relative;border:2px solid transparent;border-radius:6px;background:#fff;padding:4px;cursor:grab;box-shadow:0 0 0 1px var(--line)}
.item.sel{border-color:var(--acc)}
.item.over{border-top:4px solid var(--acc)}
.item canvas{width:100%;display:block}
.num,.chips{position:absolute;top:8px;background:rgba(27,36,48,.8);color:#fff;font-size:11px;font-style:normal;padding:0 6px;border-radius:9px}
.num{left:8px}.chips{right:8px}.chips:empty{display:none}
.nm{display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.sel{background:#e3ecfb}
.item.cur{box-shadow:0 0 0 1px var(--acc),0 0 0 4px rgba(31,95,209,.25)}
.item.ib::before,.item.ia::before{content:"";position:absolute;background:var(--acc);border-radius:2px;z-index:2}
#list .item.ib::before{left:0;right:0;top:-8px;height:4px}
#list .item.ia::before{left:0;right:0;bottom:-8px;height:4px}
#grid .item.ib::before{top:0;bottom:0;left:-9px;width:4px}
#grid .item.ia::before{top:0;bottom:0;right:-9px;width:4px}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar .sp{flex:1}
#bar select{width:auto}
#bar label{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:13px}
#gsizewrap{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
#gsizewrap input{width:110px}
#grid{display:none;position:absolute;inset:0;overflow:auto;padding:16px;gap:14px;align-content:start;align-items:start;grid-template-columns:repeat(auto-fill,minmax(var(--gs,150px),1fr))}
body.grid #grid{display:grid}
body.grid #view,body.grid #list{display:none}
#after{margin-top:8px;display:flex;flex-direction:column;gap:6px}
#stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
#view{max-width:100%;max-height:100%;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.2)}
#drop{position:absolute;inset:16px;border:2px dashed #aab2bb;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:16px}
body.drag #drop{border-color:var(--acc);color:var(--acc);background:rgba(31,95,209,.06)}
#panel{width:260px;overflow:auto;padding:14px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
h2{font-size:13px;margin:0 0 6px;font-weight:650}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
label.row{display:block;color:var(--mute);font-size:13px}
label.row b{float:right;color:var(--ink);font-weight:500}
input[type=range]{width:100%}
select,input[type=text]{width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .wide{grid-column:1/-1}
small{color:var(--mute)}
#ptoggle{display:none;align-items:center;gap:4px;font-weight:600}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9;-webkit-tap-highlight-color:transparent}
#overlay.show{display:block}
#phandle{display:none;text-align:center;padding:10px 0 2px;color:var(--mute);font-size:13px;cursor:pointer;user-select:none;-webkit-user-select:none}
#phandle::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}
@media(max-width:820px){
header{padding:max(8px,env(safe-area-inset-top)) 10px 8px;gap:4px}
h1{font-size:14px}
header div{gap:4px;flex-wrap:wrap}
label[for="folder"]{display:none}
button,.btn{padding:8px 11px;min-height:42px;font-size:13px}
#bar{padding:5px 10px;gap:4px 8px}
#bar label:has(#aftersel){display:none}
main{flex-direction:column;flex-wrap:nowrap}
#list{width:100%;height:82px;flex-direction:row;padding:6px;gap:6px;border-right:0;border-bottom:1px solid var(--line);flex:none}
.item{width:56px;flex:none}
.num{font-size:9px;padding:0 4px;top:5px;left:5px}
.chips{font-size:9px;padding:0 3px;top:5px;right:5px}
.nm{font-size:9px}
#stage{flex:1;min-height:0;padding:8px}
#drop{inset:8px;font-size:14px}
#ptoggle{display:inline-flex}
#phandle{display:block}
#panel{position:fixed;bottom:0;left:0;right:0;width:100%;max-height:55vh;overflow:auto;border-left:0;border-top:0;transform:translateY(100%);transition:transform .3s ease;z-index:10;box-shadow:0 -4px 20px rgba(0,0,0,.15);border-radius:14px 14px 0 0;padding-top:0;gap:10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#panel.open{transform:translateY(0);padding-bottom:max(14px,env(safe-area-inset-bottom))}
#grid{padding:10px;gap:10px}
.acts{gap:4px}
.seg{gap:4px}
.seg button{font-size:12px;padding:6px 8px;min-height:36px}
.acts button{min-height:40px}
h2{font-size:12px;margin:0 0 4px}
label.row{font-size:12px}
}
@media(max-width:420px){
header div>*{flex:1;text-align:center;padding:8px 4px}
#list{height:72px}
.item{width:48px}
button,.btn{padding:7px 8px;font-size:12px;min-height:40px}
}
</style>
</head>
<body>
<header>
  <h1>Ảnh sang PDF</h1>
  <div>
    <label class="btn" for="file">Thêm ảnh</label>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <label class="btn" for="folder">Thêm thư mục</label>
    <input id="folder" type="file" accept="image/*" webkitdirectory multiple hidden>
    <button id="clearall" class="danger" disabled>Xóa tất cả</button>
    <button id="export" class="primary" disabled>Xuất PDF</button>
  </div>
</header>
<div id="bar">
  <button id="gridbtn">Xem lưới</button>
  <span id="gsizewrap" hidden>Cỡ <input type="range" id="gsize" min="90" max="320" value="150"></span>
  <select id="sortsel" aria-label="Sắp xếp">
    <option value="">Sắp xếp...</option>
    <option value="name">Theo tên file (1, 2, 10)</option>
    <option value="time">Theo thời gian file</option>
    <option value="rev">Đảo ngược thứ tự</option>
  </select>
  <button id="dup">Nhân đôi</button>
  <button id="undo" disabled>Hoàn tác</button>
  <button id="redo" disabled>Làm lại</button>
  <label><input type="checkbox" id="aftersel"> Chèn ảnh mới sau trang đang chọn</label>
  <button id="ptoggle">⚙ Chỉnh sửa</button>
  <span class="sp"></span>
  <small id="info" title="Ctrl/Shift + bấm để chọn nhiều trang. Alt + mũi tên để dời trang. Ctrl+Z hoàn tác."></small>
</div>
<main>
  <aside id="list" aria-label="Danh sách trang"></aside>
  <section id="stage">
    <div id="grid"></div>
    <div id="drop">Kéo ảnh vào đây<br>hoặc bấm Thêm ảnh</div>
    <canvas id="view" hidden></canvas>
  </section>
  <div id="overlay"></div>
  <aside id="panel">
    <div id="phandle">Chỉnh sửa ảnh</div>
    <div>
      <h2>Kiểu hiển thị</h2>
      <div class="seg" id="filters">
        <button data-f="orig">Gốc</button>
        <button data-f="gray">Xám</button>
        <button data-f="doc">Tài liệu màu</button>
        <button data-f="docgray">Tài liệu xám</button>
        <button data-f="bw">Đen trắng</button>
      </div>
    </div>
    <div>
      <label class="row">Độ sáng <b id="bv"></b><input type="range" id="bright" min="-60" max="60" step="1"></label>
      <label class="row">Tương phản <b id="cv"></b><input type="range" id="contrast" min="0.6" max="2.2" step="0.05"></label>
      <label class="row" id="trow">Ngưỡng đen trắng <b id="tv"></b><input type="range" id="thresh" min="60" max="230" step="1"></label>
      <label class="row" id="srow">Làm nét chữ <b id="sv"></b><input type="range" id="sharp" min="0" max="2" step="0.1"></label>
    </div>
    <div class="acts">
      <button id="crop" class="wide">Cắt và nắn phẳng</button>
      <button id="rl">Xoay trái</button>
      <button id="rr">Xoay phải</button>
      <button id="orig" class="wide">Giữ để xem ảnh gốc</button>
      <button id="all" class="wide">Áp dụng cho tất cả trang</button>
      <button id="del" class="wide danger">Xóa trang đã chọn</button>
    </div>
    <div id="cropbar" hidden>
      <h2>Cắt và nắn phẳng</h2>
      <small>Kéo 4 chấm tròn cho khớp 4 góc tờ giấy.</small>
      <div class="acts" style="margin-top:8px">
        <button id="auto" class="wide">Tự tìm viền</button>
        <button id="creset">Đặt lại</button>
        <button id="uncrop">Bỏ cắt</button>
        <button id="ccancel">Hủy</button>
        <button id="cok" class="primary">Áp dụng</button>
      </div>
      <small id="cmsg"></small>
    </div>
    <div>
      <h2>Xuất PDF</h2>
      <label class="row">Khổ giấy
        <select id="size"><option value="a4">A4</option><option value="fit">Theo kích thước ảnh</option></select>
      </label><br>
      <label class="row">Chất lượng
        <select id="qual">
          <option value="1200,0.6">Nhỏ nhất (1200 px)</option>
          <option value="1800,0.75" selected>Cân bằng (1800 px)</option>
          <option value="2600,0.85">Rõ nét (2600 px)</option>
        </select>
      </label><br>
      <label class="row">Tên file<input type="text" id="name" value="tai-lieu"></label>
      <small id="status"></small>
      <div id="after" hidden><b>Đã xuất xong.</b><button id="next" class="primary">Xóa tất cả để scan tiếp</button></div>
    </div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const pages = []; let cur = -1, uid = 0, showOrig = false, timer = 0;

/* ---------- Xử lý ảnh ---------- */
// Lọc tách chiều ngang rồi chiều dọc; avg=true: trung bình, ngược lại: giá trị lớn nhất
function sep(d, w, h, r, avg) {
  const t = new Uint8ClampedArray(d.length);
  for (let pass = 0; pass < 2; pass++) {
    const src = pass ? t : d, dst = pass ? d : t;
    const A = pass ? h : w, B = pass ? w : h, st = pass ? w * 4 : 4, ls = pass ? 4 : w * 4;
    for (let l = 0; l < B; l++) for (let a = 0; a < A; a++) for (let c = 0; c < 3; c++) {
      let m = 0, sum = 0, n = 0;
      for (let j = Math.max(0, a - r); j <= Math.min(A - 1, a + r); j++) {
        const v = src[l * ls + j * st + c]; if (v > m) m = v; sum += v; n++;
      }
      dst[l * ls + a * st + c] = avg ? sum / n : m;
    }
  }
}
// Ước lượng màu nền giấy (bỏ chữ, bỏ bóng đổ) để chia ra
function background(c) {
  const sw = Math.max(8, Math.round(c.width / 10)), sh = Math.max(8, Math.round(c.height / 10));
  const s = document.createElement('canvas'); s.width = sw; s.height = sh;
  const sx = s.getContext('2d', { willReadFrequently: true });
  sx.drawImage(c, 0, 0, sw, sh);
  const id = sx.getImageData(0, 0, sw, sh);
  sep(id.data, sw, sh, 3, false); sep(id.data, sw, sh, 3, true);
  sx.putImageData(id, 0, 0);
  const t = document.createElement('canvas'); t.width = c.width; t.height = c.height;
  const tx = t.getContext('2d', { willReadFrequently: true });
  tx.imageSmoothingQuality = 'high'; tx.drawImage(s, 0, 0, c.width, c.height);
  return tx.getImageData(0, 0, c.width, c.height).data;
}
const lv = v => Math.max(0, Math.min(255, (v - 70) * 255 / 165));
function process(c, x, p) {
  const img = x.getImageData(0, 0, c.width, c.height), d = img.data, f = p.filter;
  const bg = (f === 'doc' || f === 'docgray' || f === 'bw') ? background(c) : null;
  const k = p.contrast, o = p.bright;
  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i + 1], b = d[i + 2];
    if (bg) {
      r = lv(r / Math.max(bg[i], 1) * 255);
      g = lv(g / Math.max(bg[i + 1], 1) * 255);
      b = lv(b / Math.max(bg[i + 2], 1) * 255);
    }
    if (f !== 'doc' && f !== 'orig') r = g = b = .299 * r + .587 * g + .114 * b;
    if (f === 'bw') { r = g = b = r > p.thresh ? 255 : 0; }
    else { r = (r - 128) * k + 128 + o; g = (g - 128) * k + 128 + o; b = (b - 128) * k + 128 + o; }
    d[i] = r; d[i + 1] = g; d[i + 2] = b;
  }
  if (f !== 'bw' && p.sharp > 0) sharpen(d, c.width, c.height, p.sharp);
  x.putImageData(img, 0, 0);
}
function sharpen(d, w, h, amt) {
  const o = new Uint8ClampedArray(d);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) for (let c = 0; c < 3; c++) {
    const i = (y * w + x) * 4 + c;
    const bl = (o[i - 4] + o[i + 4] + o[i - w * 4] + o[i + w * 4] + o[i - 4 - w * 4] + o[i + 4 - w * 4] + o[i - 4 + w * 4] + o[i + 4 + w * 4] + o[i]) / 9;
    d[i] = o[i] + amt * (o[i] - bl) * 1.5;
  }
}
function dims(p) { const b = p.bmp; return p.rot % 2 ? [b.height, b.width] : [b.width, b.height]; }
// Ảnh đã xoay, chưa lọc
function base(p, s) {
  const b = p.bmp, [W, H] = dims(p), w = Math.max(2, Math.round(W * s)), h = Math.max(2, Math.round(H * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.imageSmoothingQuality = 'high';
  x.translate(w / 2, h / 2); x.rotate(p.rot * Math.PI / 2);
  x.drawImage(b, -b.width * s / 2, -b.height * s / 2, b.width * s, b.height * s);
  x.setTransform(1, 0, 0, 1, 0, 0);
  return c;
}
// Nắn phẳng: kéo 4 góc (tl, tr, br, bl) thành hình chữ nhật
function warp(c, q) {
  const w = c.width, h = c.height, P = q.map(o => [o.x * w, o.y * h]);
  const L = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const ow = Math.max(2, Math.round((L(P[0], P[1]) + L(P[3], P[2])) / 2));
  const oh = Math.max(2, Math.round((L(P[0], P[3]) + L(P[1], P[2])) / 2));
  const [x0, y0] = P[0], [x1, y1] = P[1], [x2, y2] = P[2], [x3, y3] = P[3];
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
  let g = 0, hh = 0; const den = dx1 * dy2 - dx2 * dy1;
  if (den && (Math.abs(dx3) > 1e-9 || Math.abs(dy3) > 1e-9)) { g = (dx3 * dy2 - dx2 * dy3) / den; hh = (dx1 * dy3 - dx3 * dy1) / den; }
  const a = x1 - x0 + g * x1, b = x3 - x0 + hh * x3, d = y1 - y0 + g * y1, e = y3 - y0 + hh * y3;
  const src = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  const out = document.createElement('canvas'); out.width = ow; out.height = oh;
  const ox = out.getContext('2d', { willReadFrequently: true }), img = ox.createImageData(ow, oh), od = img.data;
  for (let j = 0; j < oh; j++) {
    const v = (j + .5) / oh;
    for (let i = 0; i < ow; i++) {
      const u = (i + .5) / ow, k = g * u + hh * v + 1;
      let sx = (a * u + b * v + x0) / k - .5, sy = (d * u + e * v + y0) / k - .5;
      sx = Math.max(0, Math.min(w - 1.001, sx)); sy = Math.max(0, Math.min(h - 1.001, sy));
      const ix = sx | 0, iy = sy | 0, fx = sx - ix, fy = sy - iy, p0 = (iy * w + ix) * 4, p1 = p0 + 4, p2 = p0 + w * 4, p3 = p2 + 4, o = (j * ow + i) * 4;
      for (let ch = 0; ch < 3; ch++) od[o + ch] = (src[p0 + ch] * (1 - fx) + src[p1 + ch] * fx) * (1 - fy) + (src[p2 + ch] * (1 - fx) + src[p3 + ch] * fx) * fy;
      od[o + 3] = 255;
    }
  }
  ox.putImageData(img, 0, 0); return out;
}
function render(p, max, forceOrig) {
  const [W, H] = dims(p), q = !forceOrig && p.quad; let s = Math.min(1, max / Math.max(W, H));
  if (q) {
    const xs = q.map(o => o.x), ys = q.map(o => o.y);
    s = Math.min(1, max / Math.max((Math.max(...xs) - Math.min(...xs)) * W, (Math.max(...ys) - Math.min(...ys)) * H, 1));
  }
  let c = base(p, s); if (q) c = warp(c, q);
  const x = c.getContext('2d', { willReadFrequently: true });
  if (!forceOrig && (p.filter !== 'orig' || p.bright || p.contrast !== 1 || p.sharp > 0)) process(c, x, p);
  return c;
}

/* ---------- Giao diện ---------- */
const sel = new Set(); let anchor = 0, gridMode = false, dirty = false, insAt = null;
const undoS = [], redoS = [], pend = new Set();
const copyPage = p => ({ ...p, quad: p.quad ? p.quad.map(o => ({ ...o })) : null });
const targets = () => { const t = pages.filter(p => sel.has(p.id)); return t.length ? t : (pages[cur] ? [pages[cur]] : []); };
const natural = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true });
const FL = { orig: 'Gốc', gray: 'Xám', doc: 'Tài liệu', docgray: 'Tài liệu xám', bw: 'Đen trắng' };
const metaText = p => [p.quad ? '✂' : '', p.rot ? '↻' : '', p.filter !== 'doc' ? FL[p.filter] : ''].filter(Boolean).join(' ');
const scrollCur = () => document.querySelectorAll('.item.cur').forEach(el => el.scrollIntoView({ block: 'nearest' }));

/* Hoàn tác / làm lại */
const snap = () => ({ pages: pages.map(copyPage), cur: cur >= 0 ? pages[cur].id : null, sel: [...sel] });
const updUndo = () => { $('#undo').disabled = !undoS.length; $('#redo').disabled = !redoS.length; };
function pushUndo() {
  undoS.push(snap()); if (undoS.length > 40) undoS.shift(); redoS.length = 0;
  dirty = true; $('#after').hidden = true; updUndo();
}
function restore(s) {
  if (cropping) endCrop();
  clearTimeout(timer); pend.clear();
  pages.splice(0, pages.length, ...s.pages.map(copyPage));
  sel.clear(); s.sel.forEach(id => { if (pages.some(p => p.id === id)) sel.add(id); });
  cur = pages.findIndex(p => p.id === s.cur); if (cur < 0) cur = pages.length ? 0 : -1;

    const pn = 3 + 3 * i, cn = pn + 1, inn = pn + 2;
    obj(pn, () => push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}]/Resources<</XObject<</Im0 ${inn} 0 R>>>>/Contents ${cn} 0 R>>`));
    const cs = `q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${dx.toFixed(2)} ${dy.toFixed(2)} cm /Im0 Do Q`;
    obj(cn, () => push(`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`));
    obj(inn, () => {
      if (im.kind === 'bw1') {
        push(`<</Type/XObject/Subtype/Image/Width ${im.w}/Height ${im.h}/ColorSpace/DeviceGray/BitsPerComponent 1/Filter/FlateDecode/Length ${im.data.length}>>\nstream\n`);
      } else if (im.kind === 'gray8') {
        push(`<</Type/XObject/Subtype/Image/Width ${im.w}/Height ${im.h}/ColorSpace/DeviceGray/BitsPerComponent 8/Filter/FlateDecode/DecodeParms<</Predictor 15/Columns ${im.w}/Colors 1/BitsPerComponent 8>>/Length ${im.data.length}>>\nstream\n`);
      } else {
        push(`<</Type/XObject/Subtype/Image/Width ${im.w}/Height ${im.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${im.data.length}>>\nstream\n`);
      }
      push(im.data); push('\nendstream');
    });
  });
  const xr = len, total = 3 * imgs.length + 3;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let n = 1; n < total; n++) push(String(offs[n]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<</Size ${total}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}
// Đóng gói ảnh BW (đã là 0/255) thành bitmap 1-bit rồi nén Flate — lossless, rất nhỏ
async function encodeBW1(c) {
  const w = c.width, h = c.height, d = c.getContext('2d').getImageData(0, 0, w, h).data;
  const rb = (w + 7) >> 3, bits = new Uint8Array(rb * h);
  for (let y = 0; y < h; y++) {
    const off = y * rb;
    for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4] >= 128) bits[off + (x >> 3)] |= 0x80 >> (x & 7);
    }
  }
  const stream = new Blob([bits]).stream().pipeThrough(new CompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
// Đóng gói ảnh grayscale 8-bit với PNG Paeth predictor + Flate — lossless.
// Rất hiệu quả cho docgray (nền đã chuẩn hoá trắng → đa số delta = 0).
async function encodeGray8(c) {
  const w = c.width, h = c.height, d = c.getContext('2d').getImageData(0, 0, w, h).data;
  const row = w + 1, out = new Uint8Array(row * h), prev = new Uint8Array(w);
  for (let y = 0; y < h; y++) {
    const base = y * row; out[base] = 4; // filter type: Paeth
    let left = 0, upleft = 0;
    for (let x = 0; x < w; x++) {
      const px = d[(y * w + x) * 4], up = prev[x];
      const p = left + up - upleft;
      const pa = Math.abs(p - left), pb = Math.abs(p - up), pc = Math.abs(p - upleft);
      const pred = pa <= pb && pa <= pc ? left : pb <= pc ? up : upleft;
      out[base + 1 + x] = (px - pred) & 0xff;
      upleft = up; left = px; prev[x] = px;
    }
  }
  const stream = new Blob([out]).stream().pipeThrough(new CompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
$('#export').onclick = async () => {
  const btn = $('#export'), st = $('#status'); btn.disabled = true;
  const [max, q] = $('#qual').value.split(',').map(Number), out = [];
  try {
    for (let i = 0; i < pages.length; i++) {
      st.textContent = `Đang xử lý trang ${i + 1}/${pages.length}...`;
      await new Promise(r => setTimeout(r, 0));
      const c = render(pages[i], max), f = pages[i].filter;
      if (f === 'bw') {
        out.push({ data: await encodeBW1(c), w: c.width, h: c.height, kind: 'bw1' });
      } else if (f === 'docgray') {
        out.push({ data: await encodeGray8(c), w: c.width, h: c.height, kind: 'gray8' });
      } else {
        const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
        out.push({ data: new Uint8Array(await blob.arrayBuffer()), w: c.width, h: c.height });
      }
    }
    const pdf = buildPdf(out, $('#size').value), a = document.createElement('a');
    a.href = URL.createObjectURL(pdf); a.download = ($('#name').value.trim() || 'tai-lieu') + '.pdf'; a.click();
    st.textContent = `Đã xuất ${pages.length} trang (${(pdf.size / 1048576).toFixed(1)} MB).`;
    dirty = false; $('#after').hidden = false;
  } catch (e) { st.textContent = 'Lỗi khi xuất PDF: ' + e.message; }
  btn.disabled = false;
};
